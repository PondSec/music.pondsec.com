<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>404 A.M. — Admin</title><link rel="stylesheet" href="/styles.css"/></head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/">404 A.M.</a><nav class="site-nav"><a href="/">Home</a><a href="/biography">Biography</a><a href="/discography">Discography</a><a href="/events">Events</a><a href="/news">News</a><a href="/community">Community</a><a class="active" href="/admin">Admin</a></nav><div class="header-actions"><button id="logoutBtn" class="btn hidden">Logout</button></div></div></header>
<main class="container"><section id="adminOnly" class="page-section panel"><div class="panel-head"><h2>Admin Studio</h2><p id="adminHint">Bitte als Admin einloggen (Community Seite).</p></div><div class="admin-grid"><form id="releaseForm" class="panel form-card"><h2>Release</h2><input name="name" placeholder="Release Name" required/><input name="releaseDate" type="date" required/><input name="type" placeholder="single / album"/><input name="spotifyUrl" placeholder="Spotify URL"/><input name="image" placeholder="Cover URL"/><input name="totalTracks" type="number" min="0" placeholder="Tracks"/><button class="btn primary" type="submit">Speichern</button></form><form id="eventForm" class="panel form-card"><h2>Event</h2><input name="title" placeholder="Titel" required/><input name="date" type="datetime-local" required/><input name="location" placeholder="Location"/><input name="ticketUrl" placeholder="Ticket URL"/><textarea name="description" placeholder="Beschreibung"></textarea><button class="btn primary" type="submit">Speichern</button></form><form id="announcementForm" class="panel form-card"><h2>Announcement</h2><input name="title" placeholder="Titel" required/><textarea name="content" placeholder="Text" required></textarea><label class="check"><input type="checkbox" name="pinned"/> Pinnen</label><button class="btn primary" type="submit">Veröffentlichen</button></form></div></section></main><div id="toast" class="toast hidden"></div><script src="/app.js" defer></script></body></html>
